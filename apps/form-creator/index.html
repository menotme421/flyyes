<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var key = "flyyes-theme";
          var stored = localStorage.getItem(key);
          var theme = stored;
          if (!theme || theme === "system") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "g100"
              : "white";
          }
          var root = document.documentElement;
          if (theme === "g100") root.classList.add("dark");
          else root.classList.remove("dark");
          root.style.colorScheme = theme === "g100" ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flyyes Forms</title>
    <meta name="description" content="Low-cost forms shared by link. Local-first, no login." />
    <meta name="theme-color" content="#161616" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
