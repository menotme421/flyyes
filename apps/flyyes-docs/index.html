<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var key = "flyyes-theme";
          var stored = localStorage.getItem(key);
          var theme = stored;
          if (!theme || theme === "system") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "g100"
              : "white";
          }
          var root = document.documentElement;
          if (theme === "g100") root.classList.add("dark");
          else root.classList.remove("dark");
          root.style.colorScheme = theme === "g100" ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flyyes Docs</title>
    <meta name="description" content="Simple documents, stored privately in your browser." />
    <meta name="theme-color" content="#161616" />
    <!-- WHY: Social preview card (X/Twitter etc.) — crawlers read these
         statically, so they live here, not in JS. Image URL must be absolute;
         update the host if a custom domain lands. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flyyes Docs" />
    <meta property="og:title" content="Flyyes Docs" />
    <meta property="og:description" content="Simple documents, stored privately in your browser." />
    <meta property="og:url" content="https://flyyes-7z5.pages.dev/" />
    <meta property="og:image" content="https://flyyes-7z5.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flyyes Docs" />
    <meta name="twitter:description" content="Simple documents, stored privately in your browser." />
    <meta name="twitter:image" content="https://flyyes-7z5.pages.dev/og-image.png" />
    <!-- WHY: Roboto ships bundled via Fontsource (latin subset) —
         no webfont CDN needed, works offline. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
